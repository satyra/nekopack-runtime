name: 运行问题
description: 报告安装、导入、启动、显示、音频或存档问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿上传游戏资源、完整剧情、个人存档或签名密钥。错误文字和可复现步骤通常更有帮助。
  - type: input
    id: version
    attributes:
      label: NekoPack 版本／APK SHA-256
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号和 Android 版本
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: 游戏、原版／汉化版及补丁版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明是新游戏还是读档，以及发生在哪个操作之后。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 实际结果和错误文字
      description: 分享日志前检查是否含个人路径、存档或剧情内容。
    validations:
      required: true
